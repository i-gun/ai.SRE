name: Python Tests

# NOTE: pull_request is the gating check (required status check for branch
# protection on main). The push trigger below only runs a post-merge smoke
# re-run for visibility and does NOT gate anything — merges must go through
# a Pull Request with this workflow green, per main branch protection rules.
on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

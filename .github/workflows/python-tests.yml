name: Python Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests
